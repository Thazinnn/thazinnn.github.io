<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact | Thazin's Corner</title>
    <style>
      :root {
        color-scheme: dark;
        --navy: #101b3a;
        --cream: #efe8da;
        --gold: #ffb31a;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
        background: var(--navy);
        color: var(--cream);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .page {
        position: relative;
        min-height: 100vh;
        overflow: hidden;
        background: var(--navy);
      }

      .page::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(circle at 18% 20%, rgba(255, 179, 26, 0.12), transparent 19rem),
          radial-gradient(circle at 78% 22%, rgba(255, 75, 184, 0.1), transparent 22rem),
          linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px);
        background-size: auto, auto, 100% 18px;
        mix-blend-mode: screen;
        opacity: 0.65;
      }

      .shell {
        position: relative;
        z-index: 1;
        width: min(1280px, calc(100% - 32px));
        min-height: 100vh;
        margin: 0 auto;
        padding: 28px 0 44px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 24px;
        font-weight: 700;
      }

      .brand-mark {
        color: var(--gold);
        text-shadow: 0 0 18px rgba(255, 179, 26, 0.8);
      }

      .nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        font-size: 12px;
        letter-spacing: 0.02em;
      }

      .nav-links {
        display: flex;
        align-items: center;
        gap: clamp(18px, 4vw, 52px);
        color: #dfe7d8;
      }

      .nav-links a {
        opacity: 0.86;
      }

      .nav-links a:hover {
        color: var(--gold);
      }

      .contact-board {
        position: relative;
        min-height: calc(100vh - 96px);
      }

      .contact-photo-frame {
        position: absolute;
        left: -9%;
        top: 9%;
        margin: 0;
        width: clamp(190px, 28vw, 380px);
        aspect-ratio: 1.55;
        overflow: hidden;
        border-radius: 0 42% 42% 0;
        box-shadow: 0 18px 45px rgba(0, 0, 0, 0.3);
      }

      .contact-photo-frame img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        object-position: 45% 52%;
      }

      .contact-photo-caption {
        position: absolute;
        left: 6%;
        top: 47%;
        margin: 0;
        color: var(--gold);
        font-family: "Comic Sans MS", "Segoe Print", "Bradley Hand ITC", cursive;
        font-size: clamp(18px, 2.3vw, 30px);
        font-style: italic;
        font-weight: 800;
        letter-spacing: 0.02em;
      }

      .qr-code {
        position: absolute;
        display: block;
        width: clamp(118px, 18vw, 220px);
        height: auto;
        filter: drop-shadow(0 0 18px rgba(255, 179, 26, 0.18));
      }

      .qr-code:nth-of-type(1) {
        left: 42%;
        top: 10%;
      }

      .qr-code:nth-of-type(2) {
        left: 42%;
        top: 66%;
      }

      .qr-code:nth-of-type(3) {
        left: 70%;
        top: 37%;
      }

      .qr-label {
        position: absolute;
        color: var(--gold);
        font-family: "Comic Sans MS", "Segoe Print", "Bradley Hand ITC", cursive;
        font-size: clamp(18px, 2.3vw, 30px);
        font-style: italic;
        font-weight: 800;
        letter-spacing: 0.02em;
      }

      .qr-label--github {
        left: calc(42% + clamp(118px, 18vw, 220px) + 18px);
        top: calc(10% + 72px);
      }

      .qr-label--facebook {
        left: calc(42% + clamp(118px, 18vw, 220px) + 18px);
        top: calc(66% + 72px);
      }

      .qr-label--instagram {
        left: calc(70% + clamp(118px, 18vw, 220px) + 18px);
        top: calc(37% + 72px);
      }

      .qr-label:hover {
        color: #fff2a6;
      }

      @media (max-width: 520px) {
        .brand {
          font-size: 17px;
        }

        .contact-board {
          min-height: 680px;
        }

        .contact-photo-frame {
          left: -26%;
          top: 9%;
          width: clamp(150px, 44vw, 210px);
        }

        .contact-photo-caption {
          left: 10%;
          top: 35%;
          max-width: 180px;
          font-size: 18px;
        }

        .qr-code {
          width: clamp(108px, 35vw, 160px);
        }

        .qr-code:nth-of-type(1) {
          left: 42%;
          top: 8%;
        }

        .qr-code:nth-of-type(2) {
          left: 42%;
          top: 62%;
        }

        .qr-code:nth-of-type(3) {
          left: 64%;
          top: 34%;
        }

        .qr-label {
          font-size: 18px;
        }

        .qr-label--github {
          left: 42%;
          top: calc(8% + 170px);
        }

        .qr-label--facebook {
          left: 42%;
          top: calc(62% + 170px);
        }

        .qr-label--instagram {
          left: 64%;
          top: calc(34% + 170px);
        }
      }
    </style>
  </head>
  <body>
    <main class="page" aria-label="Contact page">
      <div class="shell">
        <nav class="nav" aria-label="Main navigation">
          <a class="brand" href="index.html">
            <span class="brand-mark">*</span>
            <span>Thazin's Corner</span>
          </a>
          <div class="nav-links">
            <a href="index.html">Home</a>
          </div>
        </nav>
        <section class="contact-board" aria-label="Contact QR codes">
          <figure class="contact-photo-frame" aria-label="Decorative night portrait">
            <img src="assets/contact-side-photo.png" alt="">
          </figure>
          <p class="contact-photo-caption">Contacts to know more about me XX</p>
          <img class="qr-code" src="assets/contact-qr-1.png" alt="Contact QR code 1">
          <a class="qr-label qr-label--github" href="https://github.com/Thazinnn" aria-label="Open Thazin GitHub profile">@git hub</a>
          <img class="qr-code" src="assets/contact-qr-2.png" alt="Contact QR code 2">
          <a class="qr-label qr-label--facebook" href="https://www.facebook.com/share/19D8NfrsjJ/" aria-label="Open Thazin Facebook profile">@facebook</a>
          <img class="qr-code" src="assets/contact-qr-3.png" alt="Contact QR code 3">
          <a class="qr-label qr-label--instagram" href="https://www.instagram.com/sammy_w_z?igsh=Ym5xdWRzMDI1b2Fx" aria-label="Open Thazin Instagram profile">@instagram</a>
        </section>
      </div>
    </main>
  </body>
</html>
