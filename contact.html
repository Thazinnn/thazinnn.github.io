<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact | Thazin's Corner</title>
    <style>
      :root {
        color-scheme: dark;
        --navy: #101b3a;
        --cream: #efe8da;
        --gold: #ffb31a;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
        background: var(--navy);
        color: var(--cream);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .page {
        position: relative;
        min-height: 100vh;
        overflow-x: hidden;
        background: var(--navy);
      }

      .page::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(circle at 18% 20%, rgba(255, 179, 26, 0.12), transparent 19rem),
          radial-gradient(circle at 78% 22%, rgba(255, 75, 184, 0.1), transparent 22rem),
          linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px);
        background-size: auto, auto, 100% 18px;
        mix-blend-mode: screen;
        opacity: 0.65;
      }

      .shell {
        position: relative;
        z-index: 1;
        width: min(1280px, calc(100% - 32px));
        min-height: 100vh;
        margin: 0 auto;
        padding: 28px 0 44px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 24px;
        font-weight: 700;
      }

      .brand-mark {
        color: var(--gold);
        text-shadow: 0 0 18px rgba(255, 179, 26, 0.8);
      }

      .nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 24px;
        font-size: 12px;
        letter-spacing: 0.02em;
      }

      .nav-links {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        flex-wrap: wrap;
        gap: clamp(18px, 4vw, 52px);
        color: #dfe7d8;
      }

      .nav-links a {
        opacity: 0.86;
      }

      .nav-links a:hover {
        color: var(--gold);
      }

      .contact-board {
        position: relative;
        min-height: calc(100vh - 96px);
      }

      .contact-photo-frame {
        position: absolute;
        left: -9%;
        top: 9%;
        margin: 0;
        width: clamp(190px, 28vw, 380px);
        aspect-ratio: 1.55;
        overflow: hidden;
        border-radius: 0 42% 42% 0;
        box-shadow: 0 18px 45px rgba(0, 0, 0, 0.3);
      }

      .contact-photo-frame img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        object-position: 45% 52%;
      }

      .contact-photo-caption {
        position: absolute;
        left: 12%;
        top: calc(66% + 70px);
        max-width: 260px;
        margin: 0;
        color: var(--gold);
        font-family: "Comic Sans MS", "Segoe Print", "Bradley Hand ITC", cursive;
        font-size: clamp(15px, 1.7vw, 22px);
        font-style: italic;
        font-weight: 800;
        letter-spacing: 0.02em;
      }

      .qr-code {
        position: absolute;
        display: block;
        width: clamp(118px, 18vw, 220px);
        height: auto;
        filter: drop-shadow(0 0 18px rgba(255, 179, 26, 0.18));
      }

      .qr-code:nth-of-type(1) {
        left: 38%;
        top: 10%;
      }

      .qr-code:nth-of-type(2) {
        left: 38%;
        top: 66%;
      }

      .qr-code:nth-of-type(3) {
        left: 64%;
        top: 37%;
      }

      .qr-label {
        position: absolute;
        color: var(--gold);
        font-family: "Comic Sans MS", "Segoe Print", "Bradley Hand ITC", cursive;
        font-size: clamp(18px, 2.3vw, 30px);
        font-style: italic;
        font-weight: 800;
        letter-spacing: 0.02em;
      }

      .qr-label--github {
        left: calc(38% + clamp(118px, 18vw, 220px) + 18px);
        top: calc(10% + 72px);
      }

      .qr-label--facebook {
        left: calc(38% + clamp(118px, 18vw, 220px) + 18px);
        top: calc(66% + 72px);
      }

      .qr-label--instagram {
        left: calc(64% + clamp(118px, 18vw, 220px) + 18px);
        top: calc(37% + 72px);
      }

      .qr-label:hover {
        color: #fff2a6;
      }

      @media (max-width: 900px) {
        .shell {
          width: min(100% - 28px, 720px);
          padding-top: 22px;
        }

        .contact-board {
          display: grid;
          grid-template-columns: minmax(0, 0.9fr) minmax(128px, auto) minmax(0, 1fr);
          align-items: center;
          gap: 24px 18px;
          min-height: auto;
          padding: 42px 0 34px;
        }

        .contact-photo-frame,
        .contact-photo-caption,
        .qr-code,
        .qr-label,
        .qr-code:nth-of-type(1),
        .qr-code:nth-of-type(2),
        .qr-code:nth-of-type(3),
        .qr-label--github,
        .qr-label--facebook,
        .qr-label--instagram {
          position: relative;
          inset: auto;
          left: auto;
          right: auto;
          top: auto;
        }

        .contact-photo-frame {
          justify-self: start;
          grid-column: 1 / 2;
          grid-row: span 2;
          width: min(240px, 100%);
          border-radius: 0 38% 38% 0;
        }

        .contact-photo-caption {
          grid-column: 1 / 2;
          grid-row: 4 / 5;
          justify-self: end;
          max-width: 230px;
          text-align: right;
          font-size: clamp(16px, 2.4vw, 20px);
        }

        .qr-code {
          width: clamp(128px, 22vw, 178px);
          grid-column: 2 / 3;
          justify-self: center;
        }

        .qr-label {
          grid-column: 3 / 4;
          justify-self: start;
          font-size: clamp(18px, 3vw, 24px);
        }

        .qr-code:nth-of-type(2) {
          grid-row: 4 / 5;
        }

        .qr-label--facebook {
          grid-row: 4 / 5;
        }
      }

      @media (max-width: 520px) {
        .shell {
          width: calc(100% - 24px);
          padding-top: 18px;
        }

        .nav {
          gap: 14px;
        }

        .brand {
          font-size: 17px;
        }

        .contact-board {
          grid-template-columns: minmax(0, 1fr);
          justify-items: center;
          gap: 14px;
          min-height: auto;
          padding: 28px 0 36px;
        }

        .contact-board {
          min-height: auto;
        }

        .contact-photo-frame {
          grid-row: auto;
          grid-column: 1 / 2;
          width: min(250px, 74vw);
          justify-self: center;
          border-radius: 0 36% 36% 0;
        }

        .contact-photo-caption {
          grid-column: 1 / 2;
          grid-row: auto;
          max-width: 260px;
          font-size: 18px;
          text-align: center;
        }

        .qr-code {
          grid-column: 1 / 2;
          grid-row: auto;
          width: clamp(122px, 42vw, 160px);
          justify-self: center;
          margin-top: 12px;
        }

        .qr-label {
          grid-column: 1 / 2;
          grid-row: auto;
          font-size: 18px;
          justify-self: center;
          margin-bottom: 8px;
        }
      }

      @media (max-width: 360px) {
        .brand {
          font-size: 15px;
        }

        .nav-links {
          font-size: 10px;
        }

        .contact-photo-caption,
        .qr-label {
          font-size: 16px;
        }
      }
    </style>
  </head>
  <body>
    <main class="page" aria-label="Contact page">
      <div class="shell">
        <nav class="nav" aria-label="Main navigation">
          <a class="brand" href="index.html">
            <span class="brand-mark">*</span>
            <span>Thazin's Corner</span>
          </a>
          <div class="nav-links">
            <a href="index.html">Home</a>
          </div>
        </nav>
        <section class="contact-board" aria-label="Contact QR codes">
          <figure class="contact-photo-frame" aria-label="Decorative night portrait">
            <img src="assets/contact-side-photo.png" alt="">
          </figure>
          <p class="contact-photo-caption">Contacts to know more about me XX</p>
          <img class="qr-code" src="assets/contact-qr-1.png" alt="Contact QR code 1">
          <a class="qr-label qr-label--github" href="https://github.com/Thazinnn" aria-label="Open Thazin GitHub profile">@git hub</a>
          <img class="qr-code" src="assets/contact-qr-2.png" alt="Contact QR code 2">
          <a class="qr-label qr-label--facebook" href="https://www.facebook.com/share/19D8NfrsjJ/" aria-label="Open Thazin Facebook profile">@facebook</a>
          <img class="qr-code" src="assets/contact-qr-3.png" alt="Contact QR code 3">
          <a class="qr-label qr-label--instagram" href="https://www.instagram.com/sammy_w_z?igsh=Ym5xdWRzMDI1b2Fx" aria-label="Open Thazin Instagram profile">@instagram</a>
        </section>
      </div>
    </main>
  </body>
</html>
