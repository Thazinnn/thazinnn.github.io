<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact | Thazin's Corner</title>
    <style>
      :root {
        color-scheme: dark;
        --navy: #101b3a;
        --cream: #efe8da;
        --gold: #ffb31a;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
        background: var(--navy);
        color: var(--cream);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .page {
        position: relative;
        min-height: 100vh;
        overflow: hidden;
        background: var(--navy);
      }

      .page::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(circle at 18% 20%, rgba(255, 179, 26, 0.12), transparent 19rem),
          radial-gradient(circle at 78% 22%, rgba(255, 75, 184, 0.1), transparent 22rem),
          linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px);
        background-size: auto, auto, 100% 18px;
        mix-blend-mode: screen;
        opacity: 0.65;
      }

      .shell {
        position: relative;
        z-index: 1;
        width: min(1280px, calc(100% - 32px));
        min-height: 100vh;
        margin: 0 auto;
        padding: 28px 0 44px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 24px;
        font-weight: 700;
      }

      .brand-mark {
        color: var(--gold);
        text-shadow: 0 0 18px rgba(255, 179, 26, 0.8);
      }

      .nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        font-size: 12px;
        letter-spacing: 0.02em;
      }

      .nav-links {
        display: flex;
        align-items: center;
        gap: clamp(18px, 4vw, 52px);
        color: #dfe7d8;
      }

      .nav-links a {
        opacity: 0.86;
      }

      .nav-links a:hover {
        color: var(--gold);
      }

      @media (max-width: 520px) {
        .brand {
          font-size: 17px;
        }
      }
    </style>
  </head>
  <body>
    <main class="page" aria-label="Contact page">
      <div class="shell">
        <nav class="nav" aria-label="Main navigation">
          <a class="brand" href="index.html">
            <span class="brand-mark">*</span>
            <span>Thazin's Corner</span>
          </a>
          <div class="nav-links">
            <a href="index.html">Home</a>
          </div>
        </nav>
      </div>
    </main>
  </body>
</html>
