<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>About Me | Thazin's Corner</title>
    <style>
      :root {
        color-scheme: dark;
        --navy: #101b3a;
        --cream: #efe8da;
        --ink: #16140f;
        --green: #24492f;
        --gold: #ffb31a;
        --coral: #ff6e55;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
        background: var(--navy);
        color: var(--cream);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .page {
        position: relative;
        min-height: 100vh;
        overflow: hidden;
        background: var(--navy);
      }

      .page::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(circle at 18% 20%, rgba(255, 179, 26, 0.12), transparent 19rem),
          radial-gradient(circle at 78% 22%, rgba(255, 75, 184, 0.1), transparent 22rem),
          linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px);
        background-size: auto, auto, 100% 18px;
        mix-blend-mode: screen;
        opacity: 0.65;
      }

      .shell {
        position: relative;
        z-index: 1;
        width: min(1280px, calc(100% - 32px));
        min-height: 100vh;
        margin: 0 auto;
        padding: 28px 0 44px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 24px;
        font-weight: 700;
      }

      .brand-mark {
        color: var(--gold);
        text-shadow: 0 0 18px rgba(255, 179, 26, 0.8);
      }

      .nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        font-size: 12px;
        letter-spacing: 0.02em;
      }

      .nav-links {
        display: flex;
        align-items: center;
        gap: clamp(18px, 4vw, 52px);
        color: #dfe7d8;
      }

      .nav-links a {
        opacity: 0.86;
      }

      .nav-links a:hover {
        color: var(--gold);
      }

      .about-panel {
        position: relative;
        display: grid;
        grid-template-columns: 1fr 0.9fr;
        gap: clamp(32px, 7vw, 96px);
        min-height: calc(100vh - 150px);
        margin-top: 42px;
        padding: clamp(38px, 6vw, 72px);
        overflow: hidden;
        color: var(--cream);
      }

      .about-copy {
        position: relative;
        z-index: 2;
        align-self: center;
        max-width: 560px;
      }

      h1 {
        margin: 0 0 28px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(64px, 8vw, 128px);
        line-height: 0.88;
        letter-spacing: 0;
      }

      .bio {
        max-width: 460px;
        margin: 0;
        color: rgba(239, 232, 218, 0.78);
        font-size: clamp(15px, 1.5vw, 20px);
        font-weight: 700;
        line-height: 1.28;
      }

      .accent-line {
        width: min(380px, 80%);
        height: 8px;
        margin-top: 42px;
        border-radius: 999px;
        background: var(--coral);
      }

      .visual {
        position: relative;
        min-height: 440px;
        align-self: center;
      }

      .shape {
        position: absolute;
        right: 8%;
        top: 50%;
        z-index: 1;
        width: min(360px, 72%);
        aspect-ratio: 0.72;
        overflow: hidden;
        transform: translateY(-50%);
        background: transparent;
      }

      .shape img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 42%;
      }

      .pill {
        position: absolute;
        z-index: 3;
        display: grid;
        place-items: center;
        min-width: 220px;
        min-height: 58px;
        padding: 14px 28px;
        border-radius: 999px;
        background: var(--gold);
        color: #4a2c00;
        font-size: clamp(15px, 1.5vw, 19px);
        font-weight: 800;
        box-shadow: 0 8px 0 rgba(171, 114, 0, 0.18);
      }

      .pill.date {
        left: 2%;
        top: 34%;
      }

      .pill.country {
        right: 0;
        top: 76%;
      }

      @media (max-width: 520px) {
        .brand {
          font-size: 17px;
        }
      }

      @media (max-width: 820px) {
        .about-panel {
          grid-template-columns: 1fr;
          gap: 24px;
          min-height: auto;
          padding: 34px 24px 48px;
        }

        .visual {
          min-height: 360px;
        }

        .pill.date {
          left: 0;
        }

        .pill.country {
          right: 0;
        }
      }
    </style>
  </head>
  <body>
    <main class="page" aria-label="About me page">
      <div class="shell">
        <nav class="nav" aria-label="Main navigation">
          <a class="brand" href="index.html">
            <span class="brand-mark">*</span>
            <span>Thazin's Corner</span>
          </a>
          <div class="nav-links">
            <a href="index.html">Home</a>
          </div>
        </nav>

        <section class="about-panel" aria-label="About me introduction">
          <div class="about-copy">
            <h1>Hello,<br>I'm Thazin!</h1>
            <p class="bio">
              I am a student who enjoys learning new things, exploring my interests, trying creative projects and playing volleyball.
            </p>
            <div class="accent-line" aria-hidden="true"></div>
          </div>

          <div class="visual" aria-hidden="true">
            <div class="shape">
              <img src="assets/about-portrait.png" alt="">
            </div>
            <div class="pill date">10th August 2007</div>
            <div class="pill country">Myanmar</div>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
