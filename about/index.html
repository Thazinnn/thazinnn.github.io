<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>About Me | Thazin's Corner</title>
    <style>
      :root {
        color-scheme: dark;
        --night: #01060c;
        --navy: #030b14;
        --cream: #f2eadc;
        --muted: #aaaeb2;
        --gold: #f3ad43;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
        background: var(--night);
        color: var(--cream);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .page {
        position: relative;
        min-height: 100vh;
        overflow-x: hidden;
        background:
          radial-gradient(circle at 76% 24%, rgba(28, 45, 57, 0.28), transparent 35rem),
          linear-gradient(135deg, #02070d 0%, #06111d 58%, #020810 100%);
      }

      .page::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(circle at 20% 16%, rgba(243, 173, 67, 0.045), transparent 22rem),
          radial-gradient(circle at 84% 72%, rgba(59, 93, 115, 0.1), transparent 28rem);
      }

      .shell {
        position: relative;
        z-index: 1;
        width: min(1320px, calc(100% - 64px));
        min-height: 100vh;
        margin: 0 auto;
        padding: 22px 0 30px;
      }

      .nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 24px;
        font-size: 16px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 30px;
        font-weight: 700;
      }

      .brand-mark {
        color: var(--gold);
        font-size: 26px;
        text-shadow: 0 0 18px rgba(243, 173, 67, 0.62);
      }

      .nav-links {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: clamp(22px, 4vw, 52px);
        color: #d8dcda;
      }

      .nav-links a {
        position: relative;
        padding: 8px 4px 13px;
        opacity: 0.88;
      }

      .nav-links a:hover,
      .nav-links a[aria-current="page"] {
        color: var(--gold);
        opacity: 1;
      }

      .nav-links a[aria-current="page"]::after {
        content: "";
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        height: 1px;
        background: var(--gold);
      }

      .about {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(390px, 0.78fr);
        align-items: center;
        gap: clamp(40px, 7vw, 100px);
        min-height: calc(100vh - 96px);
        padding: clamp(40px, 7vh, 78px) clamp(18px, 4vw, 60px);
      }

      .about-copy {
        position: relative;
        z-index: 2;
        max-width: 650px;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--gold);
        font-family: "Segoe Print", "Bradley Hand ITC", "Comic Sans MS", cursive;
        font-size: clamp(22px, 2.7vw, 36px);
        font-style: italic;
        transform: rotate(-2deg);
        transform-origin: left center;
      }

      h1 {
        margin: 0 0 28px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(64px, 8.3vw, 118px);
        font-weight: 400;
        line-height: 0.88;
        letter-spacing: -0.045em;
      }

      .bio {
        max-width: 560px;
        margin: 0;
        color: var(--muted);
        font-size: clamp(16px, 1.55vw, 20px);
        line-height: 1.62;
      }

      .portrait {
        position: relative;
        width: min(100%, 440px);
        justify-self: center;
        margin: 0;
        aspect-ratio: 0.78;
        overflow: hidden;
        clip-path: polygon(13% 3%, 34% 0, 53% 4%, 76% 1%, 94% 11%, 98% 31%, 94% 50%, 100% 72%, 88% 93%, 67% 97%, 47% 94%, 24% 100%, 7% 87%, 3% 65%, 7% 44%, 1% 22%);
        -webkit-mask-image:
          linear-gradient(to right, transparent 0%, #000 9%, #000 92%, transparent 100%),
          linear-gradient(to bottom, transparent 0%, #000 7%, #000 93%, transparent 100%);
        -webkit-mask-composite: source-in;
        mask-image:
          linear-gradient(to right, transparent 0%, #000 9%, #000 92%, transparent 100%),
          linear-gradient(to bottom, transparent 0%, #000 7%, #000 93%, transparent 100%);
        mask-composite: intersect;
      }

      .portrait::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(1, 6, 12, 0.08), transparent 45%, rgba(1, 6, 12, 0.28));
        pointer-events: none;
      }

      .portrait img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 48%;
        filter: saturate(0.76) contrast(1.08) brightness(0.84);
      }

      @media (max-width: 820px) {
        .shell {
          width: min(100% - 32px, 700px);
        }

        .brand {
          font-size: 22px;
        }

        .nav {
          font-size: 13px;
        }

        .about {
          grid-template-columns: 1fr;
          gap: 34px;
          min-height: auto;
          padding: 64px 10px 40px;
        }

        .about-copy {
          max-width: 600px;
        }

        .portrait {
          width: min(390px, 78vw);
        }
      }

      @media (max-width: 520px) {
        .shell {
          width: calc(100% - 24px);
          padding-top: 16px;
        }

        .nav {
          gap: 10px;
        }

        .brand {
          gap: 7px;
          font-size: 19px;
        }

        .brand-mark {
          font-size: 18px;
        }

        .nav-links {
          gap: 12px;
          font-size: 11px;
        }

        .nav-links a {
          padding-bottom: 8px;
        }

        .about {
          padding-top: 48px;
        }

        .eyebrow {
          font-size: 23px;
        }

        h1 {
          margin-bottom: 22px;
          font-size: clamp(54px, 17vw, 76px);
        }

        .bio {
          font-size: 15px;
          line-height: 1.55;
        }

      }
    </style>
  </head>
  <body>
    <main class="page" aria-label="About me page">
      <div class="shell">
        <nav class="nav" aria-label="Main navigation">
          <a class="brand" href="../">
            <span class="brand-mark">*</span>
            <span>Thazin's Corner</span>
          </a>
          <div class="nav-links">
            <a href="../">Home</a>
            <a href="./" aria-current="page">About me</a>
          </div>
        </nav>

        <section class="about" aria-labelledby="about-title">
          <div class="about-copy">
            <p class="eyebrow">A little about me</p>
            <h1 id="about-title">Hello,<br>I'm Thazin!</h1>
            <p class="bio">I am a student who enjoys learning new things, exploring my interests, trying creative projects, and playing volleyball. I like turning curiosity into something I can create, share, and keep improving.</p>
          </div>

          <figure class="portrait">
            <img src="../assets/about-portrait.png" alt="Portrait of Thazin at night">
          </figure>
        </section>
      </div>
    </main>
  </body>
</html>
