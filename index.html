<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thazin</title>
    <style>
      :root {
        color-scheme: dark;
        background: #03040d;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        min-height: 100vh;
        background:
          radial-gradient(circle at 18% 78%, rgba(0, 255, 221, 0.2), transparent 30%),
          radial-gradient(circle at 84% 18%, rgba(255, 0, 153, 0.22), transparent 32%),
          linear-gradient(135deg, #03040d 0%, #06051a 46%, #02020a 100%);
      }

      .background {
        position: fixed;
        inset: 0;
        isolation: isolate;
        background:
          radial-gradient(circle at 10% 94%, rgba(0, 255, 242, 0.22), transparent 30%),
          radial-gradient(circle at 90% 8%, rgba(255, 0, 200, 0.24), transparent 36%),
          radial-gradient(circle at 58% 54%, rgba(132, 0, 255, 0.16), transparent 42%);
      }

      .background::before,
      .background::after {
        content: "";
        position: absolute;
        inset: -22vmax;
        background-repeat: no-repeat;
        filter: blur(18px) saturate(180%);
        mix-blend-mode: screen;
        opacity: 0.92;
        transform-origin: center;
      }

      .background::before {
        background:
          radial-gradient(72vmax 12vmax at 4% 72%, transparent 34%, rgba(0, 255, 224, 0.92) 39%, transparent 48%),
          radial-gradient(90vmax 14vmax at 32% 58%, transparent 34%, rgba(0, 132, 255, 0.84) 39%, transparent 48%),
          radial-gradient(86vmax 13vmax at 68% 43%, transparent 35%, rgba(188, 77, 255, 0.86) 40%, transparent 49%),
          radial-gradient(76vmax 12vmax at 97% 35%, transparent 33%, rgba(255, 0, 170, 0.86) 39%, transparent 48%);
        animation: drift 18s ease-in-out infinite alternate;
      }

      .background::after {
        background:
          radial-gradient(70vmax 10vmax at 3% 77%, transparent 37%, rgba(181, 255, 0, 0.68) 42%, transparent 50%),
          radial-gradient(92vmax 11vmax at 42% 55%, transparent 35%, rgba(0, 255, 255, 0.52) 40%, transparent 49%),
          radial-gradient(82vmax 10vmax at 78% 50%, transparent 34%, rgba(255, 0, 255, 0.64) 39%, transparent 48%),
          radial-gradient(70vmax 9vmax at 98% 20%, transparent 34%, rgba(82, 255, 178, 0.62) 40%, transparent 50%);
        opacity: 0.78;
        filter: blur(9px) saturate(210%);
        animation: float 22s ease-in-out infinite alternate;
      }

      .wave {
        position: absolute;
        left: -14vw;
        width: 128vw;
        height: 36vh;
        border-radius: 50%;
        opacity: 0.72;
        filter: blur(8px) saturate(190%);
        mix-blend-mode: screen;
      }

      .wave.one {
        top: 30vh;
        border-top: 2px solid rgba(0, 255, 234, 0.95);
        box-shadow:
          0 -22px 58px rgba(0, 255, 255, 0.34),
          0 14px 46px rgba(255, 0, 214, 0.4);
        transform: rotate(-6deg);
        animation: breathe-one 16s ease-in-out infinite alternate;
      }

      .wave.two {
        top: 19vh;
        border-bottom: 2px solid rgba(255, 0, 184, 0.92);
        box-shadow:
          0 -16px 52px rgba(132, 0, 255, 0.36),
          0 22px 46px rgba(0, 255, 170, 0.28);
        transform: rotate(10deg);
        animation: breathe-two 19s ease-in-out infinite alternate;
      }

      .grain {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        background-image:
          linear-gradient(rgba(0, 255, 255, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 0, 200, 0.035) 1px, transparent 1px),
          radial-gradient(circle at center, rgba(255, 255, 255, 0.08), transparent 1px);
        background-size: 46px 46px, 46px 46px, 3px 3px;
        mask-image: radial-gradient(circle at center, black, transparent 80%);
        opacity: 0.42;
      }

      .spark {
        position: absolute;
        border-radius: 999px;
        filter: blur(1px);
        mix-blend-mode: screen;
      }

      .spark.cyan {
        top: 17vh;
        left: 16vw;
        width: 18vmax;
        height: 18vmax;
        background: radial-gradient(circle, rgba(0, 255, 234, 0.32), transparent 62%);
        animation: pulse 8s ease-in-out infinite alternate;
      }

      .spark.pink {
        right: 8vw;
        bottom: 14vh;
        width: 22vmax;
        height: 22vmax;
        background: radial-gradient(circle, rgba(255, 0, 184, 0.28), transparent 64%);
        animation: pulse 10s ease-in-out infinite alternate-reverse;
      }

      .spark.green {
        left: 45vw;
        bottom: 6vh;
        width: 15vmax;
        height: 15vmax;
        background: radial-gradient(circle, rgba(176, 255, 0, 0.2), transparent 68%);
        animation: pulse 12s ease-in-out infinite alternate;
      }

      @keyframes drift {
        from {
          transform: translate3d(-1.6vw, 0, 0) rotate(-2deg) scale(1);
        }

        to {
          transform: translate3d(2vw, -2vh, 0) rotate(2.5deg) scale(1.04);
        }
      }

      @keyframes float {
        from {
          transform: translate3d(1.5vw, -1vh, 0) rotate(2deg) scale(1.03);
        }

        to {
          transform: translate3d(-2vw, 2vh, 0) rotate(-2deg) scale(1);
        }
      }

      @keyframes breathe-one {
        from {
          transform: translateY(0) rotate(-6deg) scaleX(1);
        }

        to {
          transform: translateY(-3vh) rotate(-3deg) scaleX(1.04);
        }
      }

      @keyframes breathe-two {
        from {
          transform: translateY(0) rotate(10deg) scaleX(1.02);
        }

        to {
          transform: translateY(4vh) rotate(7deg) scaleX(0.98);
        }
      }

      @keyframes pulse {
        from {
          opacity: 0.45;
          transform: scale(0.96);
        }

        to {
          opacity: 0.9;
          transform: scale(1.08);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .background::before,
        .background::after,
        .wave,
        .spark {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="background" aria-label="Portfolio background">
      <div class="wave one"></div>
      <div class="wave two"></div>
      <div class="spark cyan"></div>
      <div class="spark pink"></div>
      <div class="spark green"></div>
      <div class="grain"></div>
    </main>
  </body>
</html>
