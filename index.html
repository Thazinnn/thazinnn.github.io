<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thazin Portfolio</title>
    <style>
      :root {
        color-scheme: dark;
        --navy: #101b3a;
        --navy-dark: #071024;
        --black: #030403;
        --cream: #efe8da;
        --muted: #b8c3ad;
        --orange: #d87a2c;
        --gold: #ffb31a;
        --lime: #d4ff43;
        --pink: #ff4bb8;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        background: var(--navy);
      }

      body {
        min-height: 100vh;
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--cream);
        background: var(--navy);
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .page {
        position: relative;
        min-height: 100vh;
        overflow: hidden;
        background: var(--navy);
      }

      .page::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(circle at 18% 20%, rgba(255, 179, 26, 0.12), transparent 19rem),
          radial-gradient(circle at 78% 22%, rgba(255, 75, 184, 0.1), transparent 22rem),
          linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px);
        background-size: auto, auto, 100% 18px;
        mix-blend-mode: screen;
        opacity: 0.65;
      }

      .shell {
        position: relative;
        z-index: 1;
        width: min(1280px, calc(100% - 32px));
        min-height: 100vh;
        margin: 0 auto;
        padding: 28px 0 44px;
      }

      .nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        font-size: 12px;
        letter-spacing: 0.02em;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 24px;
        font-weight: 700;
      }

      .brand-mark,
      .star {
        color: var(--gold);
        text-shadow: 0 0 18px rgba(255, 179, 26, 0.8);
      }

      .nav-links {
        display: flex;
        align-items: center;
        gap: clamp(18px, 4vw, 52px);
        color: #dfe7d8;
      }

      .nav-links a {
        opacity: 0.86;
      }

      .nav-links a:hover {
        color: var(--gold);
      }

      .hero {
        position: relative;
        display: block;
        min-height: calc(100vh - 120px);
        padding-top: 38px;
      }

      .portrait-block {
        position: absolute;
        left: 0;
        top: 56px;
        z-index: 2;
        width: min(460px, 42vw);
      }

      .portrait-card {
        position: relative;
        width: 100%;
        aspect-ratio: 1.33;
        overflow: hidden;
        background: var(--black);
        box-shadow: 18px 22px 0 rgba(0, 0, 0, 0.24);
      }

      .portrait-card::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 1;
        background:
          linear-gradient(180deg, rgba(16, 27, 58, 0.08), rgba(16, 27, 58, 0.28)),
          repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.05) 0 1px, transparent 1px 4px);
        pointer-events: none;
        mix-blend-mode: screen;
      }

      .portrait-card::after {
        content: none;
      }

      .portrait-card img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        filter: saturate(0.72) contrast(1.08) brightness(0.86);
      }

      .welcome-note {
        margin: 22px 0 0;
        color: var(--gold);
        font-size: clamp(16px, 2vw, 23px);
        font-style: italic;
        font-weight: 700;
        line-height: 1.35;
        text-shadow: 0 0 16px rgba(255, 218, 74, 0.52);
      }

      .headline {
        position: relative;
        min-height: 540px;
        width: min(960px, 100%);
        margin: 0 auto;
        padding-bottom: 40px;
      }

      h1 {
        position: relative;
        z-index: 4;
        margin: 0 0 0 108px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(68px, 10.8vw, 140px);
        line-height: 0.78;
        letter-spacing: 0;
        text-transform: uppercase;
        color: var(--cream);
      }

      .outline-stack {
        position: absolute;
        left: clamp(390px, 43vw, 520px);
        top: 118px;
        z-index: 3;
        display: grid;
        gap: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(56px, 8.8vw, 116px);
        line-height: 0.74;
        text-transform: uppercase;
        color: transparent;
        -webkit-text-stroke: 1px rgba(212, 255, 67, 0.65);
        text-shadow: 0 0 20px rgba(212, 255, 67, 0.12);
        opacity: 0.9;
      }

      .sparkles {
        position: absolute;
        left: 10px;
        top: 180px;
        display: grid;
        gap: 24px;
        font-size: 36px;
      }

      @media (max-width: 820px) {
        .shell {
          width: min(100% - 28px, 620px);
          padding-top: 22px;
        }

        .nav {
          align-items: flex-start;
        }

        .nav-links {
          gap: 16px;
          font-size: 11px;
        }

        .hero {
          min-height: auto;
          padding-top: 38px;
        }

        .headline {
          min-height: 520px;
          padding-bottom: 46px;
        }

        .outline-stack {
          left: 42vw;
          top: 98px;
        }

        .portrait-block {
          top: 54px;
          width: min(420px, 72vw);
        }

        .sparkles {
          left: 0;
          top: 145px;
          font-size: 30px;
        }
      }

      @media (max-width: 520px) {
        .brand {
          font-size: 17px;
        }

        .nav-links a:nth-child(3) {
          display: none;
        }

        h1 {
          margin-left: 42px;
          font-size: clamp(48px, 15vw, 74px);
        }

        .outline-stack {
          font-size: clamp(44px, 14vw, 68px);
          left: 46vw;
          top: 78px;
        }

        .headline {
          min-height: 430px;
        }

        .portrait-block {
          top: 46px;
          width: min(340px, 78vw);
        }

      }
    </style>
  </head>
  <body>
    <main class="page" aria-label="Thazin portfolio homepage">
      <div class="shell">
        <nav class="nav" aria-label="Main navigation">
          <a class="brand" href="#">
            <span class="brand-mark">*</span>
            <span>Thazin's Corner</span>
          </a>
          <div class="nav-links">
            <a href="about.html">About me</a>
            <a href="contact.html">Contact</a>
          </div>
        </nav>

        <section class="hero">
          <div class="headline">
            <div class="sparkles" aria-hidden="true">
              <span class="star">*</span>
              <span class="star">*</span>
            </div>
            <h1>Portfolio</h1>
            <div class="portrait-block">
              <div class="portrait-card">
                <img src="assets/night-portrait.png" alt="Night portrait by a parked car">
              </div>
              <p class="welcome-note">Welcome to my portfolio!! Thank you for visiting and being part of my journey&lt;3</p>
            </div>
            <div class="outline-stack" aria-hidden="true">
              <span>Folio</span>
              <span>Folio</span>
              <span>Folio</span>
            </div>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
