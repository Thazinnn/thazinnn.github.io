<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thazin Portfolio</title>
    <style>
      :root {
        color-scheme: dark;
        --navy: #101b3a;
        --navy-dark: #071024;
        --black: #030403;
        --cream: #efe8da;
        --muted: #b8c3ad;
        --orange: #d87a2c;
        --gold: #ffb31a;
        --lime: #d4ff43;
        --pink: #ff4bb8;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        background: var(--navy);
      }

      body {
        min-height: 100vh;
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--cream);
        background: var(--navy);
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .page {
        position: relative;
        min-height: 100vh;
        overflow: hidden;
        background: var(--navy);
      }

      .page::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(circle at 18% 20%, rgba(255, 179, 26, 0.12), transparent 19rem),
          radial-gradient(circle at 78% 22%, rgba(255, 75, 184, 0.1), transparent 22rem),
          linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px);
        background-size: auto, auto, 100% 18px;
        mix-blend-mode: screen;
        opacity: 0.65;
      }

      .shell {
        position: relative;
        z-index: 1;
        width: min(1280px, calc(100% - 32px));
        min-height: 100vh;
        margin: 0 auto;
        padding: 28px 0 44px;
      }

      .nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        font-size: 12px;
        letter-spacing: 0.02em;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 24px;
        font-weight: 700;
      }

      .brand-mark,
      .star {
        color: var(--gold);
        text-shadow: 0 0 18px rgba(255, 179, 26, 0.8);
      }

      .nav-links {
        display: flex;
        align-items: center;
        gap: clamp(18px, 4vw, 52px);
        color: #dfe7d8;
      }

      .nav-links a {
        opacity: 0.86;
      }

      .nav-links a:hover {
        color: var(--gold);
      }

      .hero {
        position: relative;
        display: grid;
        grid-template-columns: 1.12fr 0.88fr;
        align-items: end;
        min-height: calc(100vh - 120px);
        padding-top: 30px;
      }

      .portrait-card {
        position: relative;
        align-self: center;
        width: min(760px, 58vw);
        margin-left: 8px;
        aspect-ratio: 0.86;
        overflow: hidden;
        background: var(--black);
        box-shadow: 24px 26px 0 rgba(0, 0, 0, 0.32);
      }

      .portrait-card::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 1;
        background:
          linear-gradient(180deg, rgba(16, 27, 58, 0.08), rgba(16, 27, 58, 0.28)),
          repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.05) 0 1px, transparent 1px 4px);
        pointer-events: none;
        mix-blend-mode: screen;
      }

      .portrait-card::after {
        content: none;
      }

      .portrait-card img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        filter: saturate(0.72) contrast(1.08) brightness(0.86);
      }

      .headline {
        position: relative;
        min-height: 560px;
        padding-bottom: 74px;
      }

      h1 {
        position: relative;
        z-index: 2;
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(58px, 10.5vw, 138px);
        line-height: 0.78;
        letter-spacing: 0;
        text-transform: uppercase;
        color: var(--cream);
      }

      .outline-stack {
        position: absolute;
        left: clamp(90px, 18vw, 215px);
        top: 118px;
        z-index: 1;
        display: grid;
        gap: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(62px, 10vw, 136px);
        line-height: 0.74;
        text-transform: uppercase;
        color: transparent;
        -webkit-text-stroke: 1px rgba(212, 255, 67, 0.65);
        text-shadow: 0 0 20px rgba(212, 255, 67, 0.12);
        opacity: 0.9;
      }

      .sparkles {
        position: absolute;
        left: 10px;
        top: 180px;
        display: grid;
        gap: 24px;
        font-size: 36px;
      }

      @media (max-width: 820px) {
        .shell {
          width: min(100% - 28px, 620px);
          padding-top: 22px;
        }

        .nav {
          align-items: flex-start;
        }

        .nav-links {
          gap: 16px;
          font-size: 11px;
        }

        .hero {
          display: flex;
          flex-direction: column-reverse;
          align-items: stretch;
          min-height: auto;
          padding-top: 38px;
          gap: 36px;
        }

        .headline {
          min-height: 430px;
          padding-bottom: 46px;
        }

        .outline-stack {
          left: 12vw;
          top: 98px;
        }

        .portrait-card {
          width: min(560px, 100%);
          margin: 0 0 56px;
        }

        .sparkles {
          left: 0;
          top: 145px;
          font-size: 30px;
        }
      }

      @media (max-width: 520px) {
        .brand {
          font-size: 17px;
        }

        .nav-links a:nth-child(3) {
          display: none;
        }

        h1 {
          font-size: clamp(46px, 16vw, 76px);
        }

        .outline-stack {
          font-size: clamp(50px, 18vw, 82px);
          top: 78px;
        }

        .headline {
          min-height: 350px;
        }

      }
    </style>
  </head>
  <body>
    <main class="page" aria-label="Thazin portfolio homepage">
      <div class="shell">
        <nav class="nav" aria-label="Main navigation">
          <a class="brand" href="#">
            <span class="brand-mark">*</span>
            <span>Thazin's Corner</span>
          </a>
          <div class="nav-links">
            <a href="#about">About me</a>
            <a href="#contact">Contact</a>
            <a href="#social">Social Link</a>
          </div>
        </nav>

        <section class="hero">
          <div class="portrait-card">
            <img src="assets/night-portrait.png" alt="Night portrait by a parked car">
          </div>

          <div class="headline">
            <div class="sparkles" aria-hidden="true">
              <span class="star">*</span>
              <span class="star">*</span>
            </div>
            <h1>Portfolio</h1>
            <div class="outline-stack" aria-hidden="true">
              <span>Folio</span>
              <span>Folio</span>
              <span>Folio</span>
            </div>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
